name: Release

# Once CI passes on a push to main, releases queue_it and flutter_queue_it if their version
# isn't on pub.dev yet. They always have the same version and are released together: this tags
# the commit v<version> and runs the Publish workflow on the tag, which checks both packages,
# publishes them and creates the GitHub release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One release at a time, and never stop one halfway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish a new version
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # creates the tag
      actions: write # runs the Publish workflow
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Tag and publish
        run: |
          version="$(sed -n 's/^version: *//p' queue_it/pubspec.yaml)"
          flutter_version="$(sed -n 's/^version: *//p' flutter_queue_it/pubspec.yaml)"
          if [ "$version" != "$flutter_version" ]; then
            echo "::error::queue_it is $version but flutter_queue_it is $flutter_version. They're released together, so they need the same version."
            exit 1
          fi

          # Whether pub.dev has this version of a package: 200 means yes and 404 means no. Any
          # other answer stops the release, so a version that's out is never tagged again.
          on_pub_dev() {
            status="$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --max-time 20 \
              "https://pub.dev/api/packages/$1/versions/$version")" || true
            case "$status" in
              200) return 0 ;;
              404) return 1 ;;
            esac
            echo "::error::Couldn't check $1 $version on pub.dev (HTTP $status). Nothing was tagged or published. Re-run this once pub.dev answers."
            exit 1
          }
          if on_pub_dev queue_it && on_pub_dev flutter_queue_it; then
            echo "$version is on pub.dev already."
            exit 0
          fi

          # Only main's newest commit is released. A run for an older one stops here, so it
          # can't move the tag back or cancel the newer release.
          main="$(git ls-remote origin refs/heads/main | cut -f 1)"
          if [ -z "$main" ]; then
            echo "::error::Couldn't read main's newest commit."
            exit 1
          fi
          if [ "$main" != "$SHA" ]; then
            echo "::notice::main has moved on to $main, so $SHA isn't released."
            exit 0
          fi
          tag="v$version"

          # The Publish runs for the tag that haven't finished: on this commit (true) or others (false).
          unfinished_runs() {
            gh run list --workflow publish.yml --branch "$tag" --json databaseId,status,headSha \
              --jq ".[] | select(.status != \"completed\" and (.headSha == \"$SHA\") == $1) | .databaseId"
          }

          tagged="$(git ls-remote origin "refs/tags/$tag" "refs/tags/$tag^{}" | tail -n 1 | cut -f 1)"
          if [ -z "$tagged" ]; then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" > /dev/null
            echo "Tagged $SHA as $tag."
          elif [ "$tagged" != "$SHA" ]; then
            # The version isn't fully released, so the tag moves to this commit, and runs on the
            # old one stop.
            for run in $(unfinished_runs false); do
              gh run cancel "$run"
            done
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$SHA" -F force=true > /dev/null
            echo "Moved $tag from $tagged to $SHA."
          fi

          # Waits for a Publish run that's already going on this commit, or starts one.
          run="$(unfinished_runs true | head -n 1)"
          if [ -z "$run" ]; then
            run="$(gh api "repos/$GH_REPO/actions/workflows/publish.yml/dispatches" \
              -f ref="$tag" -F return_run_details=true --jq '.workflow_run_id // empty')"
          fi
          # GitHub doesn't always say which run it started.
          tries=0
          while [ -z "$run" ] && [ "$tries" -lt 20 ]; do
            sleep 3
            tries=$((tries + 1))
            run="$(unfinished_runs true | head -n 1)"
          done
          if [ -z "$run" ]; then
            echo "::error::Couldn't find the Publish run for $tag."
            exit 1
          fi

          url="$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$run"
          echo "Publishing $version: $url"
          if ! gh run watch "$run" --exit-status --interval 30 > /dev/null; then
            echo "::error::Publishing $version failed: $url"
            exit 1
          fi
          echo "Published $version."
