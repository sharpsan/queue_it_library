name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The packages are released together, so they share a version.
      - name: Check the versions match
        run: |
          version="$(sed -n 's/^version: *//p' queue_it/pubspec.yaml)"
          flutter_version="$(sed -n 's/^version: *//p' flutter_queue_it/pubspec.yaml)"
          if [ "$version" != "$flutter_version" ]; then
            echo "::error::queue_it is $version but flutter_queue_it is $flutter_version. They're released together, so they need the same version."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # One resolution for the whole workspace: both packages and both examples.
      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Check publishing
        run: |
          (cd queue_it && dart pub publish --dry-run)
          (cd flutter_queue_it && flutter pub publish --dry-run)

      - name: Test queue_it
        working-directory: queue_it
        run: dart test --coverage-path=coverage/lcov.info

      - name: Test flutter_queue_it
        working-directory: flutter_queue_it
        run: flutter test --coverage

      # Drives each example the way a user would, without network access.
      - name: Test the examples
        run: |
          (cd queue_it/example && dart test)
          (cd flutter_queue_it/example && flutter test)

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: queue_it/coverage/lcov.info,flutter_queue_it/coverage/lcov.info
          disable_search: true

  minimum:
    name: Analyze and test on the minimum SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Dart 3.5, the packages' minimum.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          cache: true

      - name: Take the packages out of the workspace
        run: sh tool/leave_workspace.sh

      - name: Test queue_it
        working-directory: queue_it
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Test flutter_queue_it
        working-directory: flutter_queue_it
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

  # Dependabot's updates to the workflows' actions go into dev by themselves once both jobs pass.
  merge-dependabot:
    name: Merge Dependabot's update
    needs: [check, minimum]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Merging a change to a workflow file asks for this too.
      actions: write
    steps:
      # One commit: a short lowercase subject and no body.
      - name: Squash it into dev
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          subject="$(printf '%s' "$TITLE" | sed 's/^Bump /bump /')"
          gh pr merge "$PR" --squash --delete-branch --match-head-commit "$HEAD" --subject "$subject" --body ""
