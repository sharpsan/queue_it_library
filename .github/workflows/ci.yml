name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    name: Format, analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # One resolution for the whole workspace: both packages and both examples.
      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test queue_it
        working-directory: queue_it
        run: dart test --coverage-path=coverage/lcov.info

      - name: Test flutter_queue_it
        working-directory: flutter_queue_it
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: queue_it/coverage/lcov.info,flutter_queue_it/coverage/lcov.info
          disable_search: true
